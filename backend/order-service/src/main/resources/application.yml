server:
  port: 8083

jwt:
  secret: nimbus-dev-jwt-secret-key-32-bytes!!

catalog:
  base-url: http://catalog-service

settings:
  base-url: http://settings-service

pii:
  encryption-key: ${PII_ENCRYPTION_KEY:nimbus-dev-pii-secret}
  hash-pepper: ${PII_HASH_PEPPER:nimbus-dev-pii-pepper}

spring:
  application:
    name: order-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:postgres}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:mynewpassword}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        dialect: org.hibernate.dialect.PostgreSQLDialect 
  jackson:
    serialization:
      write-dates-as-timestamps: false

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true

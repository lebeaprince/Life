server:
  port: 8083

jwt:
  secret: oderserviseserc3t1@

catalog:
  base-url: http://catalog-service

spring:
  application:
    name: order-service
  datasource:
    url: jdbc:postgresql://localhost:5430/postgres
    username: postgres
    password: mynewpassword
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update

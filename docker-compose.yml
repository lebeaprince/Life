version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    ports:
      - "5430:5430"
    environment:
      - POSTGRES_DB=postgres
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=mynewpassword
    volumes:
      - postgres-data:/var/lib/postgresql/data

  gateway:
    build: ./backend/gateway-service
    ports:
      - "8080:8080"
    depends_on:
      - identity-service
      - catalog-service
      - order-service
      - settings-service

  identity-service:
    build: ./backend/identity-service
    ports:
      - "8081:8081"
    depends_on:
      - postgres
    environment:
      - JWT_SECRET=identity5ecr3t31@
      - DB_HOST=localhost
      - DB_PORT=5432
      - DB_NAME=postgres
      - DB_USER=postgres
      - DB_PASSWORD=mynewpassword

  catalog-service:
    build: ./backend/catalog-service
    ports:
      - "8082:8082"
    depends_on:
      - postgres
    environment:
      - JWT_SECRET=identity5ecr3t31
      - DB_HOST=localhost
      - DB_PORT=5432
      - DB_NAME=postgres
      - DB_USER=postgres
      - DB_PASSWORD=mynewpassword

  order-service:
    build: ./backend/order-service
    ports:
      - "8083:8083"
    depends_on:
      - postgres
    environment:
      - JWT_SECRET=oderserviseserc3t1@
      - DB_HOST=localhost
      - DB_PORT=5432
      - DB_NAME=postgres
      - DB_USER=postgres
      - DB_PASSWORD=mynewpassword
      - CATALOG_SERVICE_URL=http://catalog-service:8082

  settings-service:
    build: ./backend/settings-service
    ports:
      - "8084:8084"
    depends_on:
      - postgres
    environment:
      - JWT_SECRET=settings5ecr3tk3y
      - DB_HOST=localhost
      - DB_PORT=5432
      - DB_NAME=postgres
      - DB_USER=postgres
      - DB_PASSWORD=mynewpassword

volumes:
  postgres-data:
